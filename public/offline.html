<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CloaxPay - Offline</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: #ffffff;
            color: #020617;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            text-align: center;
            padding: 20px;
        }
        .logo {
            width: 80px;
            height: 80px;
            background: linear-gradient(135deg, #3b82f6 0%, #06b6d4 100%);
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: bold;
            font-size: 32px;
            margin-bottom: 24px;
            box-shadow: 0 10px 15px -3px rgba(59, 130, 246, 0.2);
        }
        h1 { font-size: 24px; margin-bottom: 8px; }
        p { color: #64748b; margin-bottom: 32px; max-width: 280px; }
        .btn {
            background: #3b82f6;
            color: white;
            padding: 12px 24px;
            border-radius: 12px;
            text-decoration: none;
            font-weight: 600;
            box-shadow: 0 4px 6px -1px rgba(59, 130, 246, 0.3);
        }
    </style>
</head>
<body>
    <div class="logo">CP</div>
    <h1>No Connection</h1>
    <p>Please check your internet connection to continue using CloaxPay.</p>
    <a href="javascript:location.reload()" class="btn">Retry</a>
</body>
</html>
